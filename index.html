<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Island Murphy Beds Draft Checkout</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top left,rgba(92,204,150,.18),transparent 38rem),#f4f7f8;color:#00243c;font-family:Arial,sans-serif}.panel{width:min(760px,100%);padding:40px;border:1px solid #d9e2e7;border-radius:28px;background:#fff;box-shadow:0 24px 70px rgba(0,36,60,.12)}.badge{display:inline-flex;padding:7px 12px;border-radius:999px;background:#ecfdf5;color:#047857;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{margin:20px 0 0;font-size:clamp(34px,7vw,58px);line-height:1.02;letter-spacing:-.04em}p{margin:20px 0 0;color:#5f7484;font-size:17px;line-height:1.7}.button{display:inline-flex;margin-top:24px;padding:13px 17px;border-radius:12px;background:#3fad7d;color:white;font-weight:800;text-decoration:none}@media(max-width:600px){.panel{padding:26px 20px;border-radius:20px}}
  </style>
</head>
<body>
  <main class="panel">
    <span class="badge">Vercel API Project</span>
    <h1>Island Murphy Beds Draft Checkout</h1>
    <p>The checkout API is installed at <code>/api/create-draft-order</code>. Add the environment variables in Vercel, redeploy, then open the status endpoint.</p>
    <a class="button" href="/api/create-draft-order">Open API status</a>
  </main>
</body>
</html>
